services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cis_root
      MYSQL_DATABASE: cis
      MYSQL_USER: cis
      MYSQL_PASSWORD: cis_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "cis",
          "-pcis_dev",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  mysql_data:
