version: '3.9'

# Infraestrutura local para desenvolvimento do Facilita PrEP.
# Sobe MySQL 8 + Redis 7 + MinIO (S3 local) com um único comando:
#   docker compose up -d
#
# Para parar tudo:
#   docker compose down
#
# Para apagar dados e começar do zero:
#   docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: facilita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: facilita
      MYSQL_DATABASE: facilita_prep
      MYSQL_USER: facilita
      MYSQL_PASSWORD: facilita
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "facilita", "-pfacilita"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: facilita-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: facilita-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: facilitaminio
      MINIO_ROOT_PASSWORD: facilitaminio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria o bucket S3 automaticamente na primeira execução
  minio-setup:
    image: minio/mc:latest
    container_name: facilita-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 facilitaminio facilitaminio &&
      mc mb -p local/facilita-uploads || true &&
      mc anonymous set download local/facilita-uploads &&
      echo '✓ Bucket facilita-uploads pronto'
      "

volumes:
  mysql_data:
  redis_data:
  minio_data:
