<!-- ============================================================
  NEWSLETTER — CORREÇÃO DO ERRO NO CARREGAMENTO

  PROBLEMA: "Sua assinatura não pôde ser validada" aparece antes
  de qualquer interação do usuário.

  CAUSA COMUM: Script de validação executando imediatamente ao
  carregar a página, sem esperar pela submissão do formulário.

  SOLUÇÃO: Adicionar ao CSS/style do formulário de newsletter:
============================================================ -->
<style>
  /* Ocultar mensagem de erro/sucesso no estado inicial */
  .mc4wp-response,
  .mailchimp-response,
  .newsletter-response,
  [class*="newsletter"][class*="error"],
  [class*="newsletter"][class*="message"],
  .wpcf7-response-output,
  .subscription-error {
    display: none !important;
  }

  /* Mostrar apenas após interação (classe adicionada via JS) */
  .newsletter-submitted .mc4wp-response,
  .newsletter-submitted .mailchimp-response,
  .newsletter-submitted .newsletter-response,
  .newsletter-submitted .subscription-error {
    display: block !important;
  }
</style>

<script>
/* Newsletter — suprimir erro até primeira submissão */
(function() {
  'use strict';

  document.addEventListener('DOMContentLoaded', function() {
    /* Selecionar formulários de newsletter — ajustar seletor conforme plugin usado */
    var forms = document.querySelectorAll(
      '.mc4wp-form, .newsletter-form, [class*="newsletter"] form, #newsletter-form'
    );

    forms.forEach(function(form) {
      /* Esconder mensagem de erro existente no DOM */
      var errorMsg = form.querySelector(
        '.mc4wp-response, .response, .error-msg, [class*="error"], [class*="message"]'
      );
      if (errorMsg) {
        errorMsg.style.display = 'none';
        errorMsg.setAttribute('aria-hidden', 'true');
      }

      /* Ao submeter, permitir que a resposta apareça */
      form.addEventListener('submit', function() {
        form.classList.add('newsletter-submitted');
        if (errorMsg) {
          errorMsg.style.display = '';
          errorMsg.removeAttribute('aria-hidden');
        }
      });
    });
  });
})();
</script>
