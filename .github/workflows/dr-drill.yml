name: DR Drill (Monthly)

on:
  schedule:
    # 1st of every month at 10:00 UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to drill'
        required: false
        default: 'staging'

jobs:
  drill:
    name: DR Health Verification
    runs-on: ubuntu-latest
    steps:
      - name: Health check — basic
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "${{ secrets.STAGING_URL }}/api/health")
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: /api/health returned $STATUS"; exit 1; }

      - name: Health check — deep (DB + Redis + S3)
        run: |
          RESPONSE=$(curl -s --max-time 20 "${{ secrets.STAGING_URL }}/api/health/deep")
          echo "Deep health: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || { echo "FAIL: deep health check not ok"; exit 1; }

      - name: Verify queues operational
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "x-ops-token: ${{ secrets.OPS_TOKEN }}" \
            "${{ secrets.STAGING_URL }}/api/health/queues")
          echo "Queues status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "WARN: queue health returned $STATUS (non-fatal)"; }

      - name: Verify OpenAPI spec accessible
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "${{ secrets.STAGING_URL }}/api/docs/openapi.json")
          echo "OpenAPI spec status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: OpenAPI spec not accessible"; exit 1; }

      - name: Verify upload endpoint auth guard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -X POST "${{ secrets.STAGING_URL }}/api/upload")
          echo "Upload auth guard status: $STATUS"
          # Should return 401 (not 500 or 200 without auth)
          [ "$STATUS" = "401" ] || { echo "FAIL: upload endpoint returned $STATUS (expected 401)"; exit 1; }

      - name: DR drill complete
        run: echo "✅ DR drill completed successfully — $(date -u)"
