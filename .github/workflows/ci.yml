name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '10.4.1'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (server + client)
        run: pnpm check

      - name: Type check (web/Next.js)
        run: pnpm --filter facilita-prep-web exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Escopo restrito ao código que o lint-staged já formata (web/app usa padrão próprio).
      - name: Format check
        run: pnpm prettier --check "server/**/*.ts" "client/src/**/*.{ts,tsx}" "shared/**/*.ts"

      # Validates that server/env.ts parses successfully with a complete env set.
      # Catches cases where a previously-optional var is made required without
      # updating Railway variables — the exact cause of the May 2026 boot crash.
      # tsx (não node puro) porque Node 22 não importa .ts sem flag experimental.
      - name: Env schema smoke test
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:root@localhost:3306/test
          JWT_SECRET: test-secret-minimum-32-characters-long-xx
          CPF_HASH_SALT: test-cpf-hash-salt-minimum-32-characters-xx
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: test
          AWS_REGION: us-east-1
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          OWNER_OPEN_ID: test
          FF_EXAM_AI_ANALYSIS: 'true'
          FF_NUTRICAO_EMAILS: 'true'
          FF_REQUIRE_MFA_PRESCRIBERS: 'false'
          FF_ASAAS_NFSE: 'true'
        run: |
          export ENCRYPTION_KEY=$(printf '0%.0s' $(seq 64))
          export TOTP_ENC_KEY=$(printf '0%.0s' $(seq 64))
          pnpm exec tsx -e "import('./server/_core/env.ts').then(m => console.log('Env schema OK:', m.env.NODE_ENV)).catch(e => { console.error(e); process.exit(1); })"

      # Catches schema.ts changes that were not captured in a migration file.
      # Run db:generate locally before pushing if this step fails.
      - name: Migration drift check
        run: DATABASE_URL=mysql://root:root@localhost:3306/test pnpm db:check

      - name: Tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: License check
        run: |
          pnpm licenses list --prod --json > /tmp/licenses.json
          node --input-type=module <<'EOF'
            import { readFileSync } from 'fs'
            const data = JSON.parse(readFileSync('/tmp/licenses.json', 'utf8'))
            // Block AGPL and SSPL — copyleft that extends to network use (SaaS risk)
            // LGPL is allowed (dynamic linking safe); pure GPL packages are rare in Node
            const bad = Object.keys(data).filter(lic =>
              /AGPL|SSPL/.test(lic)
            )
            if (bad.length) {
              console.error('Forbidden licenses found:', bad.join(', '))
              for (const lic of bad) {
                const pkgs = data[lic].map(p => p.name).join(', ')
                console.error(`  ${lic}: ${pkgs}`)
              }
              process.exit(1)
            }
            const total = Object.values(data).flat().length
            console.log(`License check passed — ${total} packages, no AGPL/SSPL`)
          EOF

      - name: Build
        run: pnpm build
        env:
          VITE_APP_ID: facilita-prep
          NODE_ENV: production

      - name: Generate SBOM
        run: pnpm licenses list --prod --json > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy to Railway staging
        run: |
          echo "Staging deploy triggered via Railway webhook"
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RAILWAY_DEPLOY_HOOK_STAGING" \
            | grep -q "200\|201\|204" && echo "Deploy triggered" || echo "Deploy hook not configured"
        env:
          RAILWAY_DEPLOY_HOOK_STAGING: ${{ secrets.RAILWAY_DEPLOY_HOOK_STAGING }}

  smoke-test:
    name: Smoke test staging
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Wait for Railway deploy
        run: sleep 45

      - name: Smoke test — health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "$STAGING_URL/api/health")
          [ "$STATUS" = "200" ] || { echo "Health check failed: $STATUS"; exit 1; }
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Smoke test — OpenAPI spec
        run: |
          curl -sf --max-time 10 "$STAGING_URL/api/docs/openapi.json" | \
            grep -q '"version"' || { echo "OpenAPI spec check failed"; exit 1; }
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Smoke test — upload auth guard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 -X POST "$STAGING_URL/api/upload")
          [ "$STATUS" = "400" ] || { echo "Upload endpoint returned $STATUS (expected 400 — multer rejects before auth)"; exit 1; }
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
