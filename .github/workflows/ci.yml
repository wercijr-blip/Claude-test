name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: '10.4.1'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (server + client)
        run: pnpm check

      - name: Type check (web/Next.js)
        run: pnpm --filter facilita-prep-web exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Audit (high/critical CVEs)
        run: pnpm audit --audit-level=high
        continue-on-error: true
